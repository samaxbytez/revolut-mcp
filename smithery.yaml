startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - revolutAccessToken
    properties:
      revolutAccessToken:
        type: string
        description: Your Revolut Business API access token
      revolutBaseUrl:
        type: string
        description: API base URL (defaults to sandbox)
  commandFunction: |
    (config) => ({
      command: 'npx',
      args: ['-y', 'revolut-mcp'],
      env: {
        REVOLUT_ACCESS_TOKEN: config.revolutAccessToken,
        ...(config.revolutBaseUrl ? { REVOLUT_BASE_URL: config.revolutBaseUrl } : {})
      }
    })
  exampleConfig:
    revolutAccessToken: "your_access_token_here"
